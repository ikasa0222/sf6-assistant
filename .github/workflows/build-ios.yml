name: Build & Release iOS IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build iOS Application (Unsigned)
        run: |
          flutter build ios --release --no-codesign

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          TAG_NAME="${{ github.ref_name }}"
          if [ -z "$TAG_NAME" ]; then
            TAG_NAME="v1.2.6.5"
          fi
          zip -r -q "SF6_Assistant_${TAG_NAME}_unsigned.ipa" Payload
          cp "SF6_Assistant_${TAG_NAME}_unsigned.ipa" "SF6_Assistant_${TAG_NAME}.ipa"
          mkdir -p release-ios
          mv "SF6_Assistant_${TAG_NAME}_unsigned.ipa" release-ios/
          mv "SF6_Assistant_${TAG_NAME}.ipa" release-ios/

      - name: Upload IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-ios/*.ipa
          generate_release_notes: false
          draft: false
          prerelease: false

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: SF6_Assistant_iOS_IPA
          path: release-ios/*.ipa
          retention-days: 14
