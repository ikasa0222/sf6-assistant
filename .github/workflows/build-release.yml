name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test --concurrency=1

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi --android-skip-build-dependency-validation

      - name: Rename APKs
        run: |
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk release-apks/SF6_Assistant_${{ github.ref_name }}_arm64-v8a.apk || true
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk release-apks/SF6_Assistant_${{ github.ref_name }}_armeabi-v7a.apk || true
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk release-apks/SF6_Assistant_${{ github.ref_name }}_x86_64.apk || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-apks/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SF6_Assistant_Android_APKs
          path: release-apks/*.apk
