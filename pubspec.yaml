name: sf6_tracker
description: "街霸6助手 (SF6 Assistant) - Street Fighter 6 Companion App (Android/Flutter)"
publish_to: 'none'
version: 1.2.3-b+2403

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  flutter_staggered_animations: ^1.1.1
  font_awesome_flutter: ^10.7.0
  intl: ^0.19.0
  
  # Network & Web Scraping
  dio: ^5.4.1
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  html: ^0.15.4
  flutter_inappwebview: ^6.0.0
  
  # Local Storage & Database
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Utilities & Sharing
  share_plus: ^8.0.2
  screenshot: ^3.0.0
  path_provider: ^2.1.2
  flutter_spinkit: ^5.2.0

dependency_overrides:
  path_provider_android: 2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/framedata/
    - assets/images/characters/
    - assets/images/ranks/
